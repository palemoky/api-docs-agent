[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-docs-agent"
version = "0.1.0"
description = "An AI agent that keeps API documentation in sync with code changes by opening review-ready pull requests."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["openapi", "documentation", "llm", "agent", "github", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

# Extras are the vendor SDKs behind the pluggable providers. Installing the
# agent should not drag in every model vendor you do not use.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.50"]
openapi = ["openapi-spec-validator>=0.7"]
all = [
    "anthropic>=0.40",
    "openai>=1.40",
    "litellm>=1.50",
    "openapi-spec-validator>=0.7",
]

# PEP 735. Development tooling is not an extra: nobody installing the published
# package should be able to `pip install api-docs-agent[dev]`.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Extras the contributor environment always gets, so `uv sync` alone gives you a
# checkout where the whole test suite runs.
default-groups = ["dev"]

[project.scripts]
api-docs-agent = "api_docs_agent.cli:app"

[project.urls]
Homepage = "https://github.com/Palemoky/api-docs-agent"
Issues = "https://github.com/Palemoky/api-docs-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/api_docs_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI options as call-valued defaults; that is the framework's API.
"src/api_docs_agent/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
packages = ["api_docs_agent"]
mypy_path = "src"
ignore_missing_imports = true
