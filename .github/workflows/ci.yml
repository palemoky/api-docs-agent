name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment
        # --frozen fails the build if uv.lock has drifted from pyproject.toml,
        # so a dependency change cannot land without its lockfile.
        run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}

      - name: The pipeline creates commits, so git needs an identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --cov=api_docs_agent --cov-report=term
